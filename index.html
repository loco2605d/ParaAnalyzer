<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="textBox">
            <textarea rows="2" cols="27" placeholder="Enter You Sentence or paragraph..." id="input"> </textarea>
            <button id="count" class="button">Count</button>
            <button id="reset" class="button">Reset</button>
        </div>       
        <div class="countingWord">
            <p>Vowel Count: <span id="vow">0</span></p>
            <p>Consonant Count: <span id="con">0</span></p>
            <p>Total Word Count: <span id="word">0</span></p>
            <p>Total letters Count: <span id="letters">0</span></p>
        </div>
               
        </div>    
</body>
<script src="script.js"></script>
</html>
